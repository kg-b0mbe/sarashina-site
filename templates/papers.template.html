<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F6F1E6">
<meta name="color-scheme" content="light only">
<title>論文手帖｜Sarashina 帖（非公式）</title>
<meta name="description" content="SB Intuitionsの研究者が発表した論文を、Sarashinaとのつながりとあわせて日本語でやさしく解説する非公式ページ。">
<style>
/*__BASE_CSS__*/
.paper .orig { font-size: 13px; color: var(--sub); font-style: italic; margin: 0 0 4px; line-height: 1.6; }
.paper h2 { font-size: 20px; }
.paper ul { margin: 8px 0; padding-left: 1.2em; }
.paper li { margin: 4px 0; font-size: 14px; }
.tie { border-left: 3px solid transparent; border-image: var(--kasane-v) 1; padding: 6px 0 6px 12px; margin: 12px 0 8px; font-size: 14px; }
.tie b { display: block; font-size: 11px; color: var(--brand); font-weight: 500; letter-spacing: .1em; }
.authors { font-size: 12px; color: var(--sub); margin-top: 8px; }
.models { font-size: 13px; display: flex; flex-wrap: wrap; gap: 2px 12px; }
</style>
</head>
<body>
<!--HEADER-->
<div class="page-head">
  <div class="tate" aria-hidden="true">ろんぶんてちょう</div>
  <div>
    <h1>論文手帖</h1>
    <p>SarashinaをつくるSB Intuitionsの研究者は、国際会議や論文誌でも研究を発表しています。どんな論文を出しているのかを、Sarashinaとのつながりとあわせて日本語で紹介します。</p>
  </div>
</div>
<main>
  <div class="filters">
    <div class="filter-row" id="f-topic">
      <span class="label">分野</span>
      <button class="opt" data-v="all" aria-pressed="true">すべて</button>
      <button class="opt" data-v="pretraining" aria-pressed="false">事前学習・設計</button>
      <button class="opt" data-v="evaluation" aria-pressed="false">評価</button>
      <button class="opt" data-v="speech" aria-pressed="false">音声</button>
      <button class="opt" data-v="dialogue" aria-pressed="false">対話</button>
      <button class="opt" data-v="trust" aria-pressed="false">安全・信頼</button>
    </div>
  </div>
  <p class="count" id="count"></p>
  <div id="list"></div>
  <p class="note">
    解説は論文と公式の技術ブログを読んで書いた要約です。正確な内容は必ず原著をご確認ください。<br>
    SB Intuitions所属（発表時）の著者を含む論文を載せています。
  </p>
</main>
<!--FOOTER-->

<script id="site-data" type="application/json">/*__SITE_JSON__*/</script>
<script>
(function () {
  var DATA = JSON.parse(document.getElementById('site-data').textContent);
  var byId = {};
  DATA.models.forEach(function (m) { byId[m.id] = m; });
  var TOPIC = { pretraining: '事前学習・設計', evaluation: '評価', speech: '音声', dialogue: '対話', trust: '安全・信頼' };
  var LINK = { paper: '論文', blog: '解説ブログ', code: 'コード', data: 'データ', announce: '採択のお知らせ' };
  var state = { topic: 'all' };

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function ym(d) { var p = d.split('-'); return p[0] + '年' + Number(p[1]) + '月'; }

  function entry(p) {
    var links = Object.keys(p.links).map(function (k) {
      return '<a href="' + esc(p.links[k]) + '" target="_blank" rel="noopener">' + (LINK[k] || k) + '</a>';
    });
    var models = p.models.filter(function (id) { return byId[id]; }).map(function (id) {
      return '<a href="models.html#m-' + esc(id) + '">' + esc(byId[id].name) + '</a>';
    });
    var authors = p.authors.length > 6 ? p.authors.slice(0, 5).join(', ') + ' ほか' + (p.authors.length - 5) + '名' : p.authors.join(', ');
    return '<article class="entry paper" id="p-' + esc(p.id) + '">' +
      '<div class="entry-meta"><span>' + esc(p.venue) + '</span><span>' + ym(p.date) + '</span>' +
        '<span class="kind">' + esc(TOPIC[p.topic]) + '</span>' +
        (p.drafted_by ? '<span class="mark" title="' + esc(p.drafted_by) + '">Sarashina下書き</span>' : '') + '</div>' +
      '<h2>' + esc(p.title_ja) + '</h2>' +
      '<p class="orig">' + esc(p.title) + '</p>' +
      '<p>' + esc(p.summary) + '</p>' +
      '<ul>' + p.points.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>' +
      '<div class="tie"><b>Sarashinaとのつながり</b>' + esc(p.sarashina) +
        (models.length ? '<div class="models">' + models.join('') + '</div>' : '') + '</div>' +
      '<div class="authors">' + esc(authors) + '</div>' +
      '<div class="links">' + links.join('') + '</div>' +
      '</article>';
  }

  function render() {
    var list = DATA.papers.filter(function (p) { return state.topic === 'all' || p.topic === state.topic; })
      .sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
    document.getElementById('list').innerHTML = list.map(entry).join('');
    document.getElementById('count').textContent = '全' + DATA.papers.length + '本のうち ' + list.length + '本';
  }

  var el = document.getElementById('f-topic');
  el.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    el.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
    state.topic = b.dataset.v; render();
  });
  document.getElementById('updated').textContent = DATA.updated_at;
  render();
})();
</script>
</body>
</html>
